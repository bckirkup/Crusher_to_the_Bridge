# SonarQube Cloud Automatic Analysis (Autoscan) configuration.
# See: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis/
#
# NOTE: Autoscan reads `.sonarcloud.properties` (not `sonar-project.properties`).
# sonar.sources / sonar.tests accept plain directory paths (no wildcards);
# exclusion / inclusion properties accept path-matching patterns (* / ** / ?).

# Analyze as Python 3.11+ (matches CI matrix / requires-python).
sonar.python.version=3.11,3.12

# Treat the pytest suite as test code (not production sources).
# sonar.tests sets the root directory; sonar.test.inclusions selects files
# within it.  The scanner auto-excludes test.inclusions from sources so the
# two sets stay disjoint (fixes "source and test paths overlap" error).
sonar.tests=tests
sonar.test.inclusions=tests/**/*

# Keep generated / vendor / data blobs out of source indexing noise.
sonar.exclusions=third_party,data,_epoch_timing,__pycache__,telemetry_buffer/simulation_history.json,telemetry_buffer/artificial_lab_notebook.json
sonar.coverage.exclusions=telemetry_buffer/observation_model/score_anchors.py,telemetry_buffer/observation_model/clearance_additivity_check.py,telemetry_buffer/observation_model/route_clearance_efficiency.py,telemetry_buffer/observation_model/park_surface_check.py

sonar.sourceEncoding=UTF-8
