# SonarQube Cloud Automatic Analysis (Autoscan) configuration.
# See: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis/
#
# NOTE: Autoscan reads `.sonarcloud.properties` (not `sonar-project.properties`).
# Wildcard patterns are not supported in this file.

# Analyze as Python 3.11+ (matches CI matrix / requires-python).
sonar.python.version=3.11,3.12

# Treat the pytest suite as test code (not production sources).
sonar.tests=tests

# Keep generated / vendor / data blobs out of source indexing noise.
sonar.exclusions=third_party,data,_epoch_timing,__pycache__,telemetry_buffer/simulation_history.json,telemetry_buffer/artificial_lab_notebook.json

sonar.sourceEncoding=UTF-8
