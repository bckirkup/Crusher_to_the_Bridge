[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crusher-to-the-bridge"
version = "0.1.0"
description = "Maritime biodefense digital twin — multi-pathogen outbreak simulation"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.28",
    "plotly>=5.0",
    "pandas>=2.0",
    "pydeck>=0.8",
    "Pillow>=10.0",
]
gis = [
    "geopandas>=0.14",
    "networkx>=3.0",
]
blueprint = [
    "Pillow>=10.0",
    "pypdfium2>=4.0",
]
deploy = [
    "boto3>=1.34",
]
analysis = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "cmdstanpy>=1.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "check-jsonschema>=0.28",
]

[project.scripts]
crusher-orchestrator = "orchestrator:run"
crusher-presidio = "presidio_runner:main"

[tool.setuptools.packages.find]
include = [
    "engines*",
    "crusher_labs*",
    "picard_framework*",
    "decision_engine*",
    "presidio*",
    "telemetry_buffer*",
]

[tool.setuptools.package-data]
"picard_framework.analysis.stan" = ["*.stan", "README.md"]
"picard_framework.analysis.sentinel" = ["data/*.json", "fixtures/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C901"]
ignore = [
    "E501",   # line too long — handled by formatter
    "E741",   # ambiguous variable name (physics code uses l, I, etc.)
]

[tool.ruff.lint.mccabe]
max-complexity = 117

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]      # sys.path manipulation before imports
"scripts/*" = ["E402"]
"dashboard/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
timeout = 0
markers = [
    "timeout: mark test with a timeout (seconds)",
]

[tool.coverage.run]
source = ["."]
omit = [
    "dashboard/*",
    "scripts/*",
]

[tool.coverage.report]
show_missing = true
precision = 1
fail_under = 0
