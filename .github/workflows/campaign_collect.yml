name: campaign-collect

# Short, bounded collection pass over s3://.../campaign/* via the read-only
# collector role. Publishes a compact index as a GitHub issue (API-readable
# by anything that can read the repo, including Edison's GitHub connector).
# Deliberately does NOT stream raw campaign objects: prefix enumeration is
# paged up to the cap, per-prefix listing is capped and truncation flagged.
# An optional exact_key input fetches ONE reviewed object under a byte
# ceiling, verifies nothing beyond its own integrity, and exposes it only
# as a workflow artifact — never inline in an issue body.
#
# Reduction lane (D3): derived_key fetches ONE object under
# campaign/_derived/reducer/v1/ at a per-kind ceiling (pages 5MiB,
# indexes 1MiB, receipts 256KiB, issue envelopes 32KiB); derived_manifest
# fetches one manifest plus every derived object it lists (<=20 files,
# <=50MiB total); derived_prefix lists keys only — no object bodies.
# All derived fetches are HEAD-pinned GETs, sha256-verified, and confined
# to the derived namespace by scripts/campaign_collect_guard.py.

on:
  workflow_dispatch:
    inputs:
      max_prefixes:
        description: "cap on campaign prefixes enumerated this pass"
        required: false
        default: "50"
      keys_per_prefix:
        description: "cap on keys listed per prefix (bounded read)"
        required: false
        default: "5000"
      exact_key:
        description: "optional single object key under campaign/ to fetch"
        required: false
        default: ""
      max_fetch_bytes:
        description: "byte ceiling for exact_key fetch"
        required: false
        default: "52428800"
      derived_key:
        description: "optional single object under campaign/_derived/reducer/v1/ to fetch"
        required: false
        default: ""
      derived_manifest:
        description: "optional derived manifest/index key; fetches it plus listed objects"
        required: false
        default: ""
      derived_prefix:
        description: "optional prefix under campaign/_derived/ to enumerate (list-only)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC; remove if unwanted

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: campaign-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: aws-campaign
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      BUCKET: crusherbucket-994254241749-us-east-1-an
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_COLLECTOR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify assumed identity (must be github-crusher-collector)
        run: aws sts get-caller-identity

      - name: Denial probe — write must be refused
        run: |
          echo probe > /tmp/probe.txt
          OUT=$(aws s3api put-object --bucket "$BUCKET" \
              --key "campaign/.write-probe" --body /tmp/probe.txt 2>&1) && {
            echo "::error::put-object was NOT denied — collector role is over-scoped"
            exit 1
          }
          if echo "$OUT" | grep -q "AccessDenied"; then
            echo "put-object correctly denied (AccessDenied)"
          else
            echo "::error::put-object failed but NOT with AccessDenied — unexpected failure:"; echo "$OUT"; exit 1
          fi

      - name: Build bounded campaign index
        env:
          MAX_PREFIXES: ${{ inputs.max_prefixes }}
          KEYS_PER_PREFIX: ${{ inputs.keys_per_prefix }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone

          bucket = os.environ["BUCKET"]
          max_prefixes = int(os.environ.get("MAX_PREFIXES") or 50)
          max_keys = int(os.environ.get("KEYS_PER_PREFIX") or 5000)

          def aws(*args):
              return subprocess.run(
                  ["aws", "s3api", *args], capture_output=True, text=True, check=True
              ).stdout

          # Manual pagination: --max-items bounds the CLI paginator's Contents
          # count, NOT CommonPrefixes. Drive raw pages ourselves (no-paginate,
          # service-level max-keys) and stop once we hold more than the cap.
          prefixes, token = [], None
          while len(prefixes) < max_prefixes + 1:
              args = [
                  "list-objects-v2", "--bucket", bucket,
                  "--prefix", "campaign/", "--delimiter", "/",
                  "--max-keys", str(max_prefixes + 1 - len(prefixes)),
                  "--no-paginate", "--output", "json",
              ]
              if token:
                  args += ["--continuation-token", token]
              page = json.loads(aws(*args))
              prefixes += [cp["Prefix"] for cp in page.get("CommonPrefixes") or []]
              token = page.get("NextContinuationToken")
              if not token:
                  break
          prefixes = sorted(p for p in prefixes if p != "campaign/")
          prefixes_beyond_cap = len(prefixes) > max_prefixes or bool(token)
          prefixes = prefixes[:max_prefixes]

          rows = []
          for p in prefixes:
              page = json.loads(aws(
                  "list-objects-v2", "--bucket", bucket, "--prefix", p,
                  "--max-items", str(max_keys), "--output", "json",
              ))
              contents = page.get("Contents") or []
              rows.append({
                  "prefix": p,
                  "objects_listed": len(contents),
                  "bytes_listed": sum(o["Size"] for o in contents),
                  "truncated": bool(page.get("IsTruncated")) or bool(page.get("NextToken")),
              })

          index = {
              "generated_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "bucket": bucket,
              "bounds": {"max_prefixes": max_prefixes, "keys_per_prefix": max_keys},
              "prefixes": rows,
              "prefix_enumeration_hit_cap": prefixes_beyond_cap,
          }
          with open("campaign_index.json", "w") as f:
              json.dump(index, f, indent=2)

          lines = [
              "| prefix | objects (<= cap) | bytes | truncated |",
              "|---|---|---|---|",
          ]
          for r in rows:
              lines.append(
                  f"| `{r['prefix']}` | {r['objects_listed']} "
                  f"| {r['bytes_listed']/1e9:.2f} GB | {r['truncated']} |"
              )
          open("campaign_index.md", "w").write("\n".join(lines) + "\n")
          print(f"indexed {len(rows)} prefixes; cap hit: {prefixes_beyond_cap}")
          PY

      - name: Bounded exact-object fetch (when exact_key supplied)
        if: ${{ inputs.exact_key != '' }}
        env:
          EXACT_KEY: ${{ inputs.exact_key }}
          MAX_FETCH_BYTES: ${{ inputs.max_fetch_bytes }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          bucket = os.environ["BUCKET"]
          key = os.environ["EXACT_KEY"].strip()
          ceiling = int(os.environ.get("MAX_FETCH_BYTES") or 52428800)
          if not key.startswith("campaign/") or ".." in key or key.endswith("/"):
              raise SystemExit(f"refusing key outside campaign/ or malformed: {key!r}")
          head = json.loads(subprocess.run(
              ["aws", "s3api", "head-object", "--bucket", bucket, "--key", key,
               "--output", "json"], capture_output=True, text=True, check=True).stdout)
          size = head["ContentLength"]
          sc = (head.get("StorageClass") or "STANDARD").upper()
          if "ARCHIVE" in sc or sc == "GLACIER":
              raise SystemExit(f"refusing archived object (class {sc}); restore first")
          if size > ceiling:
              raise SystemExit(f"refusing {size} B object; ceiling {ceiling} B")
          # Pin the GET to what HEAD saw: VersionId when versioned, else ETag.
          dest = "/tmp/fetched_object"
          gargs = ["aws", "s3api", "get-object", "--bucket", bucket,
                   "--key", key]
          if head.get("VersionId"):
              gargs += ["--version-id", head["VersionId"]]
          elif head.get("ETag"):
              gargs += ["--if-match", head["ETag"]]
          gargs += [dest]
          subprocess.run(gargs, check=True)
          actual = os.path.getsize(dest)
          if actual > ceiling:
              raise SystemExit(
                  f"downloaded {actual} B exceeds ceiling {ceiling} B — refusing")
          sha = subprocess.run(["sha256sum", dest], capture_output=True,
                               text=True, check=True).stdout.split()[0]
          os.makedirs("fetched", exist_ok=True)
          out_path = os.path.join("fetched", key.rsplit("/", 1)[-1])
          os.rename(dest, out_path)
          with open("fetched/SHA256SUMS", "w") as f:
              f.write(f"{sha}  {key}\n")
          print(f"fetched {key} ({size} B), sha256 {sha}")
          PY

      - name: Bounded derived-namespace listing (when derived_prefix supplied)
        if: ${{ inputs.derived_prefix != '' }}
        env:
          DERIVED_PREFIX: ${{ inputs.derived_prefix }}
          KEYS_PER_PREFIX: ${{ inputs.keys_per_prefix }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "scripts")
          import campaign_collect_guard as guard

          bucket = os.environ["BUCKET"]
          prefix = os.environ["DERIVED_PREFIX"].strip()
          if not prefix.startswith("campaign/_derived/") or ".." in prefix.split("/"):
              raise SystemExit(f"refusing prefix outside campaign/_derived/: {prefix!r}")
          max_keys = int(os.environ.get("KEYS_PER_PREFIX") or 5000)
          keys, token = [], None
          while len(keys) < max_keys + 1:
              args = ["aws", "s3api", "list-objects-v2", "--bucket", bucket,
                      "--prefix", prefix, "--max-keys",
                      str(max_keys + 1 - len(keys)), "--no-paginate",
                      "--output", "json"]
              if token:
                  args += ["--continuation-token", token]
              page = json.loads(subprocess.run(
                  args, capture_output=True, text=True, check=True).stdout)
              keys += [o["Key"] for o in page.get("Contents") or []]
              token = page.get("NextContinuationToken")
              if not token:
                  break
          os.makedirs("fetched", exist_ok=True)
          listing = {"prefix": prefix, "objects": keys[:max_keys],
                     "truncated": bool(token) or len(keys) > max_keys}
          with open("fetched/derived_listing.json", "w") as f:
              json.dump(listing, f, indent=2)
          print(f"listed {len(listing['objects'])} keys under {prefix} "
                f"(truncated={listing['truncated']})")
          PY

      - name: Bounded derived-object fetch (when derived_key supplied)
        if: ${{ inputs.derived_key != '' }}
        env:
          DERIVED_KEY: ${{ inputs.derived_key }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "scripts")
          import campaign_collect_guard as guard

          bucket = os.environ["BUCKET"]
          key = os.environ["DERIVED_KEY"].strip()
          kind, ceiling = guard.classify_derived_key(key)
          head = json.loads(subprocess.run(
              ["aws", "s3api", "head-object", "--bucket", bucket, "--key", key,
               "--output", "json"], capture_output=True, text=True, check=True).stdout)
          size = head["ContentLength"]
          sc = (head.get("StorageClass") or "STANDARD").upper()
          if "ARCHIVE" in sc or sc == "GLACIER":
              raise SystemExit(f"refusing archived object (class {sc}); restore first")
          if size > ceiling:
              raise SystemExit(
                  f"refusing {size} B {kind}; ceiling {ceiling} B")
          dest = "/tmp/fetched_derived"
          gargs = ["aws", "s3api", "get-object", "--bucket", bucket,
                   "--key", key]
          if head.get("VersionId"):
              gargs += ["--version-id", head["VersionId"]]
          elif head.get("ETag"):
              gargs += ["--if-match", head["ETag"]]
          gargs += [dest]
          subprocess.run(gargs, check=True)
          if os.path.getsize(dest) > ceiling:
              raise SystemExit(
                  f"downloaded exceeds {kind} ceiling {ceiling} B — refusing")
          sha = subprocess.run(["sha256sum", dest], capture_output=True,
                               text=True, check=True).stdout.split()[0]
          os.makedirs("fetched", exist_ok=True)
          out_path = os.path.join("fetched", key.rsplit("/", 1)[-1])
          os.rename(dest, out_path)
          with open("fetched/SHA256SUMS", "a") as f:
              f.write(f"{sha}  {key}\n")
          print(f"fetched {key} ({size} B, {kind}), sha256 {sha}")
          PY

      - name: Bounded derived-manifest fan-out (when derived_manifest supplied)
        if: ${{ inputs.derived_manifest != '' }}
        env:
          DERIVED_MANIFEST: ${{ inputs.derived_manifest }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "scripts")
          import campaign_collect_guard as guard

          bucket = os.environ["BUCKET"]
          mkey = os.environ["DERIVED_MANIFEST"].strip()
          guard.validate_manifest_key(mkey)

          def pinned_get(key, ceiling, dest):
              head = json.loads(subprocess.run(
                  ["aws", "s3api", "head-object", "--bucket", bucket,
                   "--key", key, "--output", "json"],
                  capture_output=True, text=True, check=True).stdout)
              sc = (head.get("StorageClass") or "STANDARD").upper()
              if "ARCHIVE" in sc or sc == "GLACIER":
                  raise SystemExit(
                      f"refusing archived object {key} (class {sc})")
              if head["ContentLength"] > ceiling:
                  raise SystemExit(
                      f"refusing {head['ContentLength']} B at {key}; "
                      f"ceiling {ceiling} B")
              gargs = ["aws", "s3api", "get-object", "--bucket", bucket,
                       "--key", key]
              if head.get("VersionId"):
                  gargs += ["--version-id", head["VersionId"]]
              elif head.get("ETag"):
                  gargs += ["--if-match", head["ETag"]]
              gargs += [dest]
              subprocess.run(gargs, check=True)
              if os.path.getsize(dest) > ceiling:
                  raise SystemExit(
                      f"downloaded {key} exceeds ceiling {ceiling} B")
              return head["ContentLength"]

          os.makedirs("fetched", exist_ok=True)
          pinned_get(mkey, guard.CEILING_INDEX, "/tmp/derived_manifest.json")
          doc = json.loads(open("/tmp/derived_manifest.json").read())
          keys = guard.iter_manifest_keys(doc)
          if len(keys) > guard.MAX_COLLECT_OBJECTS:
              raise SystemExit(
                  f"manifest lists {len(keys)} objects; "
                  f"collect cap {guard.MAX_COLLECT_OBJECTS}")
          total = 0
          os.rename("/tmp/derived_manifest.json",
                    os.path.join("fetched", mkey.rsplit("/", 1)[-1]))
          with open("fetched/SHA256SUMS", "a") as sums:
              for key in keys:
                  kind, ceiling = guard.classify_derived_key(key)
                  dest = "/tmp/derived_item"
                  size = pinned_get(key, ceiling, dest)
                  total += size
                  if total > guard.MAX_COLLECT_BYTES:
                      raise SystemExit(
                          f"collect byte cap {guard.MAX_COLLECT_BYTES} B "
                          f"exceeded at {key}")
                  sha = subprocess.run(["sha256sum", dest],
                                       capture_output=True, text=True,
                                       check=True).stdout.split()[0]
                  sums.write(f"{sha}  {key}\n")
                  os.rename(dest, os.path.join(
                      "fetched", key.replace("/", "__")))
                  print(f"fetched {key} ({size} B, {kind}), sha256 {sha}")
          print(f"manifest fan-out complete: {len(keys)} objects, {total} B")
          PY

      - name: Publish index to tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Campaign storage index (collector)"
          ISSUE=$(gh issue list --state open --search "in:title \"$TITLE\"" \
                  --json number --jq '.[0].number')
          if [ -z "$ISSUE" ] || [ "$ISSUE" = "null" ]; then
            URL=$(gh issue create --title "$TITLE" \
              --body "Auto-updated by the campaign-collect workflow. Latest bounded index below.")
            ISSUE=${URL##*/}
          fi
          BODY=$(cat campaign_index.md)
          gh issue comment "$ISSUE" --body "$(printf '```\n%s\n```' "$BODY")"
          echo "published to issue #$ISSUE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: campaign-index
          path: |
            campaign_index.json
            campaign_index.md
            fetched/
          retention-days: 30
          if-no-files-found: ignore
