name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Lint with ruff (closes #89)
        run: ruff check --select E,F,W,I --ignore E501,E741 --target-version py311 engines/ crusher_labs/ picard_framework/ decision_engine/ orchestrator*.py
        continue-on-error: true

      - name: Run sanity checker
        run: python tools/sanity_checker.py --from-config

      - name: Verify platform graywater zones and wastewater pooling
        run: pytest tests/test_graywater_zones.py -v --tb=short

      - name: Validate JSON schemas (closes #83)
        env:
          PYTHONPATH: .
        run: pytest tests/test_json_schema_validation.py -v --tb=short

      - name: Run test suite with coverage (closes #89)
        run: pytest tests/ -v --tb=short --cov --cov-report=term-missing

      - name: Import hygiene (Picard / Presidio / Stackelberg)
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from picard_framework import PicardRunSpec, ShipSimulation
          from presidio import PresidioRunSpec
          from decision_engine import (
              DecisionRound, ExperienceStore, StackelbergRound, DecisionRuntime,
          )
          from decision_engine.policy import (
              ThresholdBeliefPolicy, CommandThresholdPolicy, build_policies_from_config,
          )
          from crusher_labs.cost_ledger import compute_operational_impact
          import presidio_runner
          print('Picard/Presidio/Stackelberg import hygiene OK')
          "

      - name: Presidio smoke (1 cruise, 2 epochs)
        env:
          PYTHONPATH: .
        run: |
          python presidio_runner.py \
            --fleet-config presidio/data/config/smoke_fleet.json \
            --cruises 1

      - name: Long-read sequencing and instrument TAT tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_long_read_sequencing.py tests/test_instrument_turnaround.py \
            tests/test_sequencing_config.py::test_init_observation_engine_turnaround_and_long_read -v --tb=short

      - name: Wearable anomaly scoring and cascade entry tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_wearable_anomaly_scorer.py tests/test_cascade_entry.py -v --tb=short

      - name: Verify import hygiene (stoplight deduplication)
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from crusher_labs.stoplight import stoplight_from_ct, meets_threshold, stoplight_from_long_read_verification
          from crusher_labs.protocol_engine import compute_stoplights
          from crusher_labs.lab_notebook import _stoplight_from_ct
          from crusher_labs.instrument_turnaround import InstrumentTurnaroundQueue, InstrumentTurnaroundRegistry
          from crusher_labs.modalities.long_read_sequencing import LongReadNanoporeSequencing
          from crusher_labs.long_read_escalation import collect_long_read_escalation_requests, is_long_read_enabled
          from orchestrator_types import SimulationState, ObservationEngine, ProtocolContext
          from orchestrator_init import initialize_ship_graph, build_engine, init_observation_engine
          from orchestrator_epoch import sync_vsp_isolation, step_fred_compliance, run_observation_sampling, confine_all_agents, apply_surface_decontamination, apply_zone_closures
          from orchestrator_record import record_epoch, finalize_simulation
          from orchestrator_display import print_executive_summary
          print('Import hygiene OK: modules split correctly, stoplight canonical')
          "

      - name: Verify dashboard imports (LCARS command deck)
        env:
          PYTHONPATH: .
        run: |
          python -c "
          import plotly.graph_objects as go
          import dashboard
          from dashboard import aggregate_transmission_pathway_totals
          from dashboard.theme import apply_lcars_layout
          totals = aggregate_transmission_pathway_totals([{
              'contact_tracing': {'transmission_events': [
                  {'pathway_breakdown': {'food:test': 1.0}}
              ]}
          }])
          assert totals.get('food') == 1.0
          fig = go.Figure(data=[go.Scatter(x=[1], y=[1])])
          apply_lcars_layout(fig, plot_bgcolor='rgba(0,0,0,0.85)', height=200)
          assert fig.layout.plot_bgcolor == 'rgba(0,0,0,0.85)'
          print('Dashboard import OK')
          "

      - name: Run orchestrator (24-epoch smoke test)
        run: python orchestrator.py

      - name: Diagnostic cascade smoke (6-epoch, cascade enabled)
        env:
          PYTHONPATH: .
        run: pytest tests/test_smoke_diagnostic_cascade.py -v --tb=short

      - name: Verify OIS in simulation telemetry
        run: |
          python -c "
          import json
          h = json.load(open('telemetry_buffer/simulation_history.json'))
          c = h[-1]['cost_accounting']
          assert 'operational_impact_cumulative' in c, c.keys()
          assert 'operational_impact_breakdown' in c
          print('OIS cumulative:', c['operational_impact_cumulative'])
          "
