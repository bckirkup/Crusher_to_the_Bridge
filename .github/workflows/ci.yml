name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded pushes on the same ref stop paying for a runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock.txt
      - name: Lint with ruff (closes #89)
        run: |
          # F-rules are blocking (undefined names / unused imports).
          ruff check --select F --target-version py311 \
            engines/ crusher_labs/ picard_framework/ decision_engine/ \
            orchestrator*.py presidio_runner.py deploy/aws/
          # E/W/I and complexity are blocking.
          ruff check --select E,W,I,C901 --ignore E501,E741 --target-version py311 \
            engines/ crusher_labs/ picard_framework/ decision_engine/ \
            orchestrator*.py presidio_runner.py deploy/aws/

  sonar-mechanical-guard:
    name: Sonar mechanical guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run Sonar mechanical guards
        run: |
          python3 scripts/sonar_guard.py $(
            find . -type f -name '*.py' \
              ! -path './tests/*' \
              ! -path './.agents/*'
          )
          python3 scripts/sonar_guard.py --workflows .github/workflows
      - name: Run clock unit guards
        run: |
          python3 scripts/clock_guard.py $(
            find . -type f -name '*.py' \
              ! -path './tests/*' \
              ! -path './.agents/*'
          )
          python3 scripts/clock_guard.py --configs

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v6
      - name: Run zizmor
        run: |
          for workflow in .github/workflows/ci.yml .github/workflows/picard-presidio.yml \
                           .github/workflows/nightly.yml; do
            uvx --no-build --from zizmor==1.29.0 zizmor --no-progress "$workflow"
          done

  sanity-checker:
    name: Sanity checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock.txt
      - name: Run sanity checker
        run: python3 tools/sanity_checker.py --from-config

  schema-validation:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock.txt
      - name: Validate JSON schemas (closes #83)
        env:
          PYTHONPATH: .
        run: pytest tests/test_json_schema_validation.py -v --tb=short

  test:
    # The fast tier only: `-m 'not slow'` deselects the posterior-recovery fits,
    # which were ~35 of the 47 minutes this job took. `nightly.yml` runs the
    # whole suite. Both interpreters stay here because they run in parallel, so
    # the second one costs no wall clock on the gate.
    name: test (fast tier, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock.txt
      - name: Run the fast test tier with coverage (closes #89)
        run: |
          pytest tests/ -m 'not slow' -v --tb=short \
            --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  import-hygiene:
    name: Import hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock.txt
      - name: Import hygiene (Picard / Presidio / Stackelberg)
        env:
          PYTHONPATH: .
        run: |
          python3 -c "
          from picard_framework import PicardRunSpec, ShipSimulation
          from presidio import PresidioRunSpec
          from decision_engine import (
              DecisionRound, ExperienceStore, StackelbergRound, DecisionRuntime,
          )
          from decision_engine.policy import (
              ThresholdBeliefPolicy, CommandThresholdPolicy, build_policies_from_config,
          )
          from crusher_labs.cost_ledger import compute_operational_impact
          import presidio_runner
          print('Picard/Presidio/Stackelberg import hygiene OK')
          "

  presidio-smoke:
    name: Presidio smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock.txt
      - name: Presidio smoke (1 cruise, 2 epochs)
        env:
          PYTHONPATH: .
        run: |
          python3 presidio_runner.py \
            --fleet-config presidio/data/config/smoke_fleet.json \
            --cruises 1

  sentinel-smoke:
    name: Sentinel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock.txt
      - name: Sentinel smoke (bundled fleet, numpy reference walker)
        env:
          PYTHONPATH: .
        run: |
          python3 -m picard_framework.analysis.sentinel \
            --smoke \
            --out sentinel_smoke
      - name: Verify the smoke fit produced hazards, a report, and figures
        run: |
          python3 -c "
          import csv, json, os
          status = json.load(open('sentinel_smoke/fit_status.json'))
          assert status['status'] == 'smoke', status
          rows = list(csv.DictReader(open('sentinel_smoke/fleet_port_hazards.csv')))
          assert len(rows) >= 3, rows
          assert all(float(r['hazard_mean']) > 0.0 for r in rows), rows
          report = open('sentinel_smoke/report.md', encoding='utf-8').read()
          assert 'Reference walker, not NUTS' in report
          assert os.path.isfile('sentinel_smoke/figures/port_hazards.png')
          print('sentinel smoke OK:', len(rows), 'ports')
          "

  orchestrator-import-hygiene:
    name: Orchestrator import hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock.txt
      - name: Verify import hygiene (stoplight deduplication)
        env:
          PYTHONPATH: .
        run: |
          python3 -c "
          from crusher_labs.stoplight import stoplight_from_ct, meets_threshold, stoplight_from_long_read_verification
          from crusher_labs.protocol_engine import compute_stoplights
          from crusher_labs.lab_notebook import _stoplight_from_ct
          from crusher_labs.instrument_turnaround import InstrumentTurnaroundQueue, InstrumentTurnaroundRegistry
          from crusher_labs.modalities.long_read_sequencing import LongReadNanoporeSequencing
          from crusher_labs.long_read_escalation import collect_long_read_escalation_requests, is_long_read_enabled
          from orchestrator_types import SimulationState, ObservationEngine, ProtocolContext
          from orchestrator_init import initialize_ship_graph, build_engine, init_observation_engine
          from orchestrator_epoch import sync_vsp_isolation, step_fred_compliance, run_observation_sampling, confine_all_agents, apply_surface_decontamination, apply_zone_closures
          from orchestrator_record import record_epoch, finalize_simulation
          from orchestrator_display import print_executive_summary
          print('Import hygiene OK: modules split correctly, stoplight canonical')
          "

  dashboard-import:
    name: Dashboard import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock.txt
      - name: Verify dashboard imports (LCARS command deck)
        env:
          PYTHONPATH: .
        run: |
          python3 -c "
          import plotly.graph_objects as go
          import dashboard
          from dashboard import aggregate_transmission_pathway_totals
          from dashboard.theme import apply_lcars_layout
          totals = aggregate_transmission_pathway_totals([{
              'contact_tracing': {'transmission_events': [
                  {'pathway_breakdown': {'food:test': 1.0}}
              ]}
          }])
          assert totals.get('food') == 1.0
          fig = go.Figure(data=[go.Scatter(x=[1], y=[1])])
          apply_lcars_layout(fig, plot_bgcolor='rgba(0,0,0,0.85)', height=200)
          assert fig.layout.plot_bgcolor == 'rgba(0,0,0,0.85)'
          print('Dashboard import OK')
          "

  orchestrator-smoke:
    name: Orchestrator smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock.txt
      - name: Run orchestrator (24-epoch smoke test)
        run: python3 orchestrator.py
      - name: Verify OIS in simulation telemetry
        run: |
          python3 -c "
          import json
          h = json.load(open('telemetry_buffer/simulation_history.json'))
          c = h[-1]['cost_accounting']
          assert 'operational_impact_cumulative' in c, c.keys()
          assert 'operational_impact_breakdown' in c
          print('OIS cumulative:', c['operational_impact_cumulative'])
          "

  docker-campaign-smoke:
    name: Campaign Docker image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Campaign Docker image smoke
        run: |
          docker build -t picard-campaign .
          docker run --rm picard-campaign --smoke

  sonar:
    name: SonarQube Cloud
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
