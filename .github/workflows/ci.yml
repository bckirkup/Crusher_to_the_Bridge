name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sanity checker
        run: python tools/sanity_checker.py --from-config

      - name: Run test suite
        run: pytest tests/ -v --tb=short

      - name: Verify import hygiene (stoplight deduplication)
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from crusher_labs.stoplight import stoplight_from_ct, meets_threshold
          from crusher_labs.protocol_engine import compute_stoplights
          from crusher_labs.lab_notebook import _stoplight_from_ct
          from orchestrator_types import SimulationState, ObservationEngine, ProtocolContext
          from orchestrator_init import initialize_ship_graph, build_engine
          from orchestrator_epoch import sync_vsp_isolation, step_fred_compliance, run_observation_sampling, confine_all_agents, apply_surface_decontamination, apply_zone_closures
          from orchestrator_record import record_epoch, finalize_simulation
          from orchestrator_display import print_executive_summary
          from picard_framework import ShipSimulation, PicardRunSpec
          print('Import hygiene OK: modules split correctly, stoplight canonical')
          "

      - name: Verify dashboard imports (LCARS command deck)
        env:
          PYTHONPATH: .
        run: |
          python -c "
          import dashboard
          from dashboard import aggregate_transmission_pathway_totals
          totals = aggregate_transmission_pathway_totals([{
              'contact_tracing': {'transmission_events': [
                  {'pathway_breakdown': {'food:test': 1.0}}
              ]}
          }])
          assert totals.get('food') == 1.0
          print('Dashboard import OK')
          "

      - name: Run orchestrator (24-epoch smoke test)
        run: python orchestrator.py
