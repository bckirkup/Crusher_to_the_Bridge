name: Picard & Presidio

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v6
        with:
          version: "0.7.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --all-extras --no-install-project --no-build
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Sanity checker (ship + fleet libraries)
        run: python tools/sanity_checker.py --from-config
      # The Picard/Presidio/Stackelberg pytest modules are part of the fast tier
      # that ci.yml's sharded `test` jobs run on both interpreters; running them
      # again here doubled that cost on every PR. This workflow keeps the
      # end-to-end checks that are not pytest: sanity checker, import hygiene,
      # the Stackelberg data-contract validation, and the Presidio smoke run.
      - name: Import hygiene (Picard / Presidio / Stackelberg)
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from picard_framework import PicardRunSpec, ShipSimulation
          from presidio import PresidioRunSpec
          from decision_engine import (
              DecisionRound, ExperienceStore, StackelbergRound, DecisionRuntime,
          )
          from decision_engine.utility.io import export_utility_bundle, import_action_envelope
          from decision_engine.policy import ThresholdBeliefPolicy, build_policies_from_config
          from decision_engine.stackelberg.round import StackelbergRound
          import presidio_runner
          assert hasattr(StackelbergRound, 'solve_population')
          assert hasattr(StackelbergRound, 'solve_command_medical')
          print('Picard/Presidio/Stackelberg import hygiene OK')
          "
      - name: Validate Stackelberg JSON schemas
        run: |
          check-jsonschema --schemafile schemas/information_diffusion.schema.json \
            presidio/data/social/information_diffusion_default.json
          check-jsonschema --schemafile schemas/class_interactions.schema.json \
            presidio/data/social/class_interactions_default.json
          check-jsonschema --schemafile schemas/global_health_briefing.schema.json \
            presidio/data/intelligence/global_health_timeline.json
          check-jsonschema --schemafile schemas/agent_profile.schema.json \
            picard_framework/data/agent_profiles/default_ship_population.json
          check-jsonschema --schemafile schemas/resource_costs.schema.json \
            data/config/resource_costs.json
          for dir in data/platforms/*/; do
            platform=$(basename "$dir")
            [ -f "$dir/spatial_layout.json" ] || continue
            echo "=== platform schema: $platform ==="
            check-jsonschema --schemafile schemas/spatial_layout.schema.json \
              "$dir/spatial_layout.json"
            check-jsonschema --schemafile schemas/air_flow_paths.schema.json \
              "$dir/air_flow_paths.json"
          done
          for profile in data/pathogens/*.json; do
            echo "=== pathogen profile schema: $(basename "$profile") ==="
            check-jsonschema --schemafile schemas/pathogen_profiles.schema.json \
              "$profile"
          done
      - name: Presidio smoke (1 cruise, 2 epochs)
        env:
          PYTHONPATH: .
        run: |
          python presidio_runner.py \
            --fleet-config presidio/data/config/smoke_fleet.json \
            --cruises 1
