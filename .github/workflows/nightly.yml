name: Nightly

# The tier that PR CI no longer runs. `ci.yml` runs `pytest -m 'not slow'`; this
# runs the whole suite, slow tests included. Measured cost of the slow tier:
# ~35 min, nearly all of it in tests/test_sentinel_fleet_validation.py.
on:
  schedule:
    # 05:40 UTC — offset from the hour to reduce shared-runner contention.
    - cron: '40 5 * * *'
  workflow_dispatch:
    inputs:
      pytest_selection:
        description: >
          pytest -m selection. Empty runs the whole suite; "slow" runs only the
          nightly tier.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    name: full suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v6
        with:
          version: "0.7.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --all-extras --no-install-project --no-build
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run the full test suite
        env:
          PYTEST_SELECTION: ${{ inputs.pytest_selection }}
        run: |
          if [ -n "$PYTEST_SELECTION" ]; then
            pytest tests/ -m "$PYTEST_SELECTION" -v --tb=short
          else
            pytest tests/ -v --tb=short
          fi
