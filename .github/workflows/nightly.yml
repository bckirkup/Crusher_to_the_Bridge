name: Nightly

# The tier that PR CI no longer runs. `ci.yml` runs `pytest -m 'not slow'`; this
# runs the whole suite, slow tests included. The slow tier is dominated by the
# posterior-recovery fits in tests/test_sentinel_fleet_validation.py and
# tests/test_sentinel_wastewater.py, which are independent of each other, so the
# suite is split by module across jobs (tests/conftest.py, --ci-shard-*) and
# each job spreads its tests over the runner's cores with xdist.
on:
  schedule:
    # 05:40 UTC — offset from the hour to reduce shared-runner contention.
    - cron: '40 5 * * *'
  workflow_dispatch:
    inputs:
      pytest_selection:
        description: >
          pytest -m selection. Empty runs the whole suite; "slow" runs only the
          nightly tier.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    name: full suite (${{ matrix.python-version }}, shard ${{ matrix.shard-index }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard-count: [2]
        shard-index: [0, 1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v6
        with:
          version: "0.7.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --all-extras --no-install-project --no-build
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run this shard of the full test suite
        env:
          PYTEST_SELECTION: ${{ inputs.pytest_selection }}
          SHARD_COUNT: ${{ matrix.shard-count }}
          SHARD_INDEX: ${{ matrix.shard-index }}
        run: |
          if [ -n "$PYTEST_SELECTION" ]; then
            set -- -m "$PYTEST_SELECTION"
          else
            set --
          fi
          # A narrow -m selection can leave a shard with nothing to run; pytest
          # reports that as exit 5, which is not a failure here.
          pytest tests/ "$@" -v --tb=short -n auto --dist load \
            --ci-shard-count "$SHARD_COUNT" --ci-shard-index "$SHARD_INDEX" \
            || { status=$?; [ "$status" -eq 5 ] || exit "$status"; }
