repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev equal to the Ruff version in requirements.lock.txt.
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(?!tests/)(?!\.agents/).*\.py$
  - repo: local
    hooks:
      - id: sonar-mechanical-guards
        name: Sonar mechanical guards
        entry: python scripts/sonar_guard.py
        language: system
        files: ^(?!tests/)(?!\.agents/).*\.py$
        types: [python]
      - id: clock-unit-guards
        name: Clock unit guards
        entry: python scripts/clock_guard.py
        language: system
        files: ^(?!tests/)(?!\.agents/).*\.py$
        types: [python]
      - id: clock-config-guards
        name: Clock config guards
        entry: python scripts/clock_guard.py --configs
        language: system
        pass_filenames: false
        files: ^(crusher_labs/config\.yaml|data/(platforms/[^/]+/voyage_config|config/[^/]+)\.json)$
      - id: sonar-workflow-guards
        name: Sonar workflow guards
        entry: python scripts/sonar_guard.py --workflows
        language: system
        files: ^\.github/workflows/.*\.(yml|yaml)$
        types: [yaml]
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--no-progress]
