          susceptible_classes: ["passenger_general", "passenger_family", "passenger_elderly"]
          susceptible_role_group: "passenger"
        - confounder_id: "alcohol"
          prevalence_per_day: 0.08
          affected_channels:
            hrv:            {bias: -10.0, noise_mult: 1.9}
            heart_rate:     {bias: 6.0, noise_mult: 1.3}
            sleep_score:    {bias: -8.0, noise_mult: 1.4}
          susceptible_classes: ["passenger_general", "passenger_family"]
        - confounder_id: "exercise"
          prevalence_per_day: 0.20
          affected_channels:
            heart_rate:     {bias: 15.0, noise_mult: 1.2}
          susceptible_classes: []
      noise:
        - {channel: heart_rate,       sigma: 2.2,  drift_rate: 0.08, dropout_prob: 0.008}
