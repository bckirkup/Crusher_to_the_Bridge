          susceptible_classes: ["passenger_general", "passenger_family"]
        - confounder_id: "exercise"
          prevalence_per_day: 0.20
          affected_channels:
            heart_rate:     {bias: 15.0, noise_mult: 1.2}
          susceptible_classes: []
      noise:
        - {channel: heart_rate,       sigma: 2.5,  drift_rate: 0.10, dropout_prob: 0.01}
        - {channel: hrv,              sigma: 6.0,  drift_rate: 0.5,  dropout_prob: 0.01}
        - {channel: body_temp,        sigma: 0.10, drift_rate: 0.01, dropout_prob: 0.005}
        - {channel: spo2,             sigma: 0.4,  drift_rate: 0.02, dropout_prob: 0.008}
        - {channel: sleep_score,      sigma: 3.0,  drift_rate: 0.0,  dropout_prob: 0.0}
        - {channel: respiratory_rate, sigma: 1.0,  drift_rate: 0.05, dropout_prob: 0.005}

    - device_id: "oura_ring_5"
      channels: [heart_rate, hrv, body_temp, spo2, sleep_score, respiratory_rate]
      detection_profile:
        sensitivity: 0.80
        specificity: 0.93
