# ──────────────────────────────────────────────────────────────
# Crusher Labs – Diagnostic Configuration  (Phase 2.5)
# ──────────────────────────────────────────────────────────────
# LOD  = Limit of Detection
# Cadence = How often (in epochs) this modality is sampled
#           (overridden dynamically by the Escalation Matrix)

# ── Global ────────────────────────────────────────────────────
random_seed: 42
num_epochs: 24                         # total simulation epochs (override via --epochs CLI flag)

# ── Ship Graph (infection-dynamics reference) ─────────────────
ship_graph:
  num_agents: 20
  agent_roles:                        # infection-dynamics: Passenger / StrucCrew
    passenger_fraction: 0.70
    crew_fraction: 0.30
  # Zones loaded from spatial layout JSON at runtime
  spatial_layout: "data/platforms/destroyer_baseline/spatial_layout.json"
  air_flow_paths: "data/platforms/destroyer_baseline/air_flow_paths.json"
  # Fallback inline zones (used if spatial_layout file not found)
  zones:
    - {name: "Bridge",      type: "Free",     traffic: "low"}
    - {name: "MedBay",      type: "Free",     traffic: "low"}
    - {name: "Mess_Hall",   type: "Dining",   traffic: "high"}
    - {name: "Engine_Room", type: "Room",      traffic: "medium"}
    - {name: "Galley",      type: "Dining",   traffic: "high"}
    - {name: "Berthing",    type: "Room",      traffic: "medium"}

# ── GRUMB Multi-Kingdom Seeding ───────────────────────────────
grumb_seeding:
  kingdoms:
    - "Bacteria"
    - "Archaea"
    - "Fungi"
    - "Virus"
  pseudocount: 1.0e-6                 # CLR zero-handling

# ── FRED-Style Behavioral Compliance ─────────────────────────
fred_behavior:
  quarantine_compliance: 0.85         # P(agent complies with isolation order)
  compliance_delay_epochs: 1          # epochs before non-compliant agent eventually isolates
  healthy_noise_categories:           # background sick-call reasons for healthy agents
    - {reason: "seasickness",  probability: 0.008}
    - {reason: "fatigue",      probability: 0.005}
    - {reason: "minor_injury", probability: 0.002}

# ── EMOD-Style Clinical Progression ──────────────────────────
emod_progression:
  incubation_epochs: 2                # epochs from exposure before shedding starts
  shedding_phases:
    - {name: "early",  max_rate: 20.0, sensitivity_cap: 0.30}
    - {name: "peak",   max_rate: 80.0, sensitivity_cap: 0.95}
    - {name: "late",   max_rate: 40.0, sensitivity_cap: 0.80}
  phase_durations: [3, 5, 4]          # epochs per phase

# ── HVAC / CONTAM Transport ────────────────────────────────────
hvac:
  filter_efficiency: 0.50           # η – HVAC filter removal efficiency
                                    #   MERV-8  = 0.20 (residential baseline)
                                    #   MERV-13 = 0.50 (commercial standard)
                                    #   MERV-16 = 0.95 (hospital grade)
                                    #   HEPA    = 0.999 (biocontainment)
  natural_decay_rate: 0.10          # fraction of airborne pathogen lost per
                                    # epoch to settling + viral inactivation
  filter_type: "MERV-13"           # human-readable label for console output

# ── Escalation thresholds ─────────────────────────────────────
escalation:
  syndromic_suspect_threshold: 3      # daily sick-call count to trigger SUSPECTED
  pcr_confirm_ct_threshold: 35.0      # Ct ≤ this value triggers CONFIRMED

# ── Syndromic Surveillance ────────────────────────────────────
syndromic:
  description: "Symptom-based screening (fever, GI distress, etc.)"
  sick_call_probability: 0.70         # P(symptomatic agent reports to sick-call)
  background_noise_rate: 0.015        # P(healthy agent reports daily – seasickness etc.)
  cadence: 1

# ── Clinical RDT (Rapid Diagnostic Test) ─────────────────────
clinical_rdt:
  description: "Rapid Diagnostic Test (antigen lateral-flow)"
  # EMOD-style sigmoid sensitivity curve:  S(r) = S_max / (1 + exp(-k*(r - r_mid)))
  base_sensitivity: 0.95              # S_max – peak sensitivity at high shedding
  sigmoid_k: 0.08                     # steepness of the sensitivity curve
  sigmoid_midpoint: 50.0              # shedding rate at which sensitivity = S_max/2
  specificity: 0.97
  cadence: 1                          # applied per sick-call agent (on-demand)

# ── Targeted PCR ─────────────────────────────────────────────
targeted_pcr:
  description: "RT-qPCR panel for environmental / surface wipe samples"
  extraction_efficiency: 0.35         # η – fraction of pathogen mass recovered
  ct_slope: -3.322                    # k  in  Ct = -k * log10(M) + b  (≈ 100% efficiency)
  ct_intercept: 40.0                  # b  (Ct at 1 unit of recovered mass)
  lod_ct_threshold: 38.0              # Ct > this ⇒ Negative
  cadence: 4                          # baseline; escalation overrides to 1

# ── Multi-Pathogen Configuration ──────────────────────────────
multi_pathogen:
  profiles_path: "data/pathogens/active_profiles.json"
  enable_coinfection: true            # allow agents to carry multiple pathogens
  # Default susceptibility multiplier for immunocompromised agents
  immunocompromised_fraction: 0.05    # fraction of agents with elevated susceptibility
  immunocompromised_multiplier: 2.0   # dose scaling for immunocompromised

# ── Microflora Disruption ────────────────────────────────────
microflora:
  enable_dual_signal: true            # shed altered microflora alongside pathogen
  # Per-zone microbial mass pool shed by disrupted hosts per epoch
  disrupted_shed_mass: 50.0           # baseline microbial mass units per shedding agent
  # GRUMB CLR shift magnitude scaling
  clr_shift_scale: 0.15              # scales the kingdom-level CLR perturbation
  # Graywater downstream zones (accumulate microbial signatures)
  graywater_zones: ["Engine_Room"]

# ── Metagenomic Sequencing ───────────────────────────────────
sequencing:
  description: "Metagenomic shotgun sequencing of environmental samples"
  read_depth: 100000                  # total reads per sample
  pseudocount: 1.0e-6                 # for CLR zero-handling
  cadence: 8                          # baseline; escalation may override
