        - confounder_id: "exercise"
          prevalence_per_day: 0.20
          affected_channels:
            heart_rate:     {bias: 15.0, noise_mult: 1.2}
          susceptible_classes: []
      noise:
        - {channel: heart_rate,       sigma: 3.0,  drift_rate: 0.12, dropout_prob: 0.015}
        - {channel: hrv,              sigma: 7.0,  drift_rate: 0.6,  dropout_prob: 0.015}
        - {channel: body_temp,        sigma: 0.12, drift_rate: 0.015, dropout_prob: 0.008}
        - {channel: spo2,             sigma: 0.5,  drift_rate: 0.03, dropout_prob: 0.01}
        - {channel: sleep_score,      sigma: 4.0,  drift_rate: 0.0,  dropout_prob: 0.0}
        - {channel: respiratory_rate, sigma: 1.2,  drift_rate: 0.06, dropout_prob: 0.008}

    - device_id: "oura_ring_4"
      channels: [heart_rate, hrv, body_temp, spo2, sleep_score, respiratory_rate]
      detection_profile:
        sensitivity: 0.78
        specificity: 0.92
