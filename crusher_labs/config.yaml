# ──────────────────────────────────────────────────────────────
# Crusher Labs – Diagnostic Configuration  (Phase 2.5)
# ──────────────────────────────────────────────────────────────
# LOD  = Limit of Detection
# Cadence = How often (in epochs) this modality is sampled
#           (overridden dynamically by the Escalation Matrix)

# ── Global ────────────────────────────────────────────────────
random_seed: 42
num_epochs: 24                         # total simulation epochs (override via --epochs CLI flag)

# ── Ship Graph (infection-dynamics reference) ─────────────────
ship_graph:
  num_agents: 20
  agent_roles:                        # infection-dynamics: Passenger / StrucCrew
    passenger_fraction: 0.70
    crew_fraction: 0.30

  # ── Agent Class Taxonomy ────────────────────────────────────
  # Each class specifies a fraction of total agents, role group,
  # schedule profile, preferred zones, and duty station.  When
  # present, these override the legacy passenger/crew binary split.
  # Fractions must sum to 1.0.
  agent_classes:
    - class_id: "passenger_general"
      role_group: "passenger"
      fraction: 0.50
      home_zone_preference: "Berthing"
      free_zone_preference: ""
      duty_zone: ""
    - class_id: "passenger_family"
      role_group: "passenger"
      fraction: 0.10
      home_zone_preference: "Berthing"
      free_zone_preference: ""
      duty_zone: ""
    - class_id: "passenger_elderly"
      role_group: "passenger"
      fraction: 0.10
      home_zone_preference: "Berthing"
      free_zone_preference: ""
      duty_zone: ""
    - class_id: "crew_general"
      role_group: "crew"
      fraction: 0.10
      home_zone_preference: "Berthing"
      free_zone_preference: ""
      duty_zone: ""
    - class_id: "crew_medical"
      role_group: "crew"
      fraction: 0.05
      home_zone_preference: "Berthing"
      free_zone_preference: "MedBay"
      duty_zone: "MedBay"
    - class_id: "crew_engineering"
      role_group: "crew"
      fraction: 0.10
      home_zone_preference: "Berthing"
      free_zone_preference: "Engine"
      duty_zone: "Engine"
    - class_id: "crew_galley"
      role_group: "crew"
      fraction: 0.05
      home_zone_preference: "Berthing"
      free_zone_preference: ""
      duty_zone: "Galley"

  # ── Infection Counters ─────────────────────────────────────
  # Configurable per-group attack rate and infection count
  # metrics evaluated each epoch and reported in telemetry.
  # VSP cares separately about crew vs passenger attack rates.
  #
  # Supported metrics:
  #   attack_rate        – symptomatic / population in group
  #   infected_count     – currently infected agents in group
  #   symptomatic_count  – symptomatic agents in group
  #   recovered_count    – recovered agents in group
  #   susceptible_count  – susceptible agents in group
  #
  # Filters (all optional, combinable):
  #   role_group  – "crew" or "passenger" (matches agent_class prefix)
  #   classes     – explicit list of agent_class IDs
  #
  # Optional threshold fields:
  #   threshold      – numeric value; counter is "exceeded" when metric >= threshold
  #   on_exceed      – action when threshold is first breached:
  #                    "confine_symptomatic" triggers quarantine of symptomatic agents
  #                    "log_only" (default) records the breach in telemetry
  #   exempt_classes  – agent classes exempt from confinement (same as SOP exempt_classes)
  infection_counters:
    - counter_id: "crew_attack_rate"
      label: "Crew Attack Rate"
      metric: "attack_rate"
      filter:
        role_group: "crew"
    - counter_id: "passenger_attack_rate"
      label: "Passenger Attack Rate"
      metric: "attack_rate"
      filter:
        role_group: "passenger"
    - counter_id: "all_attack_rate"
      label: "Overall Attack Rate"
      metric: "attack_rate"
      filter: {}
      threshold: 0.03
      on_exceed: "confine_symptomatic"
    - counter_id: "crew_infected_count"
      label: "Crew Infected"
      metric: "infected_count"
      filter:
        role_group: "crew"
    - counter_id: "passenger_infected_count"
      label: "Passenger Infected"
      metric: "infected_count"
      filter:
        role_group: "passenger"

  # ── Gender Distribution ─────────────────────────────────────
  # Orthogonal to agent class.  Assigned randomly at startup.
  gender_distribution:
    male: 0.50
    female: 0.50

  # Zones loaded from spatial layout JSON at runtime
  spatial_layout: "data/platforms/destroyer_baseline/spatial_layout.json"
  air_flow_paths: "data/platforms/destroyer_baseline/air_flow_paths.json"
  # Fallback inline zones (used if spatial_layout file not found)
  zones:
    - {name: "Bridge",      type: "Free",     traffic: "low"}
    - {name: "MedBay",      type: "Free",     traffic: "low"}
    - {name: "Mess_Hall",   type: "Dining",   traffic: "high"}
    - {name: "Engine_Room", type: "Room",      traffic: "medium"}
    - {name: "Galley",      type: "Dining",   traffic: "high"}
    - {name: "Berthing",    type: "Room",      traffic: "medium"}

# ── GRUMB Multi-Kingdom Seeding ───────────────────────────────
grumb_seeding:
  kingdoms:
    - "Bacteria"
    - "Archaea"
    - "Fungi"
    - "Virus"
  pseudocount: 1.0e-6                 # CLR zero-handling

# ── FRED-Style Behavioral Compliance ─────────────────────────
fred_behavior:
  quarantine_compliance: 0.85         # P(agent complies with isolation order)
  compliance_delay_epochs: 1          # epochs before non-compliant agent eventually isolates
  healthy_noise_categories:           # background sick-call reasons for healthy agents
    - {reason: "seasickness",  probability: 0.008}
    - {reason: "fatigue",      probability: 0.005}
    - {reason: "minor_injury", probability: 0.002}

# ── EMOD-Style Clinical Progression ──────────────────────────
emod_progression:
  incubation_epochs: 2                # epochs from exposure before shedding starts
  shedding_phases:
    - {name: "early",  max_rate: 20.0, sensitivity_cap: 0.30}
    - {name: "peak",   max_rate: 80.0, sensitivity_cap: 0.95}
    - {name: "late",   max_rate: 40.0, sensitivity_cap: 0.80}
  phase_durations: [3, 5, 4]          # epochs per phase

# ── HVAC / CONTAM Transport ────────────────────────────────────
hvac:
  filter_efficiency: 0.50           # η – HVAC filter removal efficiency
                                    #   MERV-8  = 0.20 (residential baseline)
                                    #   MERV-13 = 0.50 (commercial standard)
                                    #   MERV-16 = 0.95 (hospital grade)
                                    #   HEPA    = 0.999 (biocontainment)
  natural_decay_rate: 0.10          # fraction of airborne pathogen lost per
                                    # epoch to settling + viral inactivation
  filter_type: "MERV-13"           # human-readable label for console output

# ── Escalation thresholds ─────────────────────────────────────
escalation:
  syndromic_suspect_threshold: 3      # daily sick-call count to trigger SUSPECTED
  pcr_confirm_ct_threshold: 35.0      # Ct ≤ this value triggers CONFIRMED

# ── Syndromic Surveillance ────────────────────────────────────
syndromic:
  description: "Symptom-based screening (fever, GI distress, etc.)"
  sick_call_probability: 0.70         # P(symptomatic agent reports to sick-call)
  background_noise_rate: 0.015        # P(healthy agent reports daily – seasickness etc.)
  cadence: 1

# ── Clinical RDT (Rapid Diagnostic Test) ─────────────────────
clinical_rdt:
  description: "Rapid Diagnostic Test (antigen lateral-flow)"
  # EMOD-style sigmoid sensitivity curve:  S(r) = S_max / (1 + exp(-k*(r - r_mid)))
  base_sensitivity: 0.95              # S_max – peak sensitivity at high shedding
  sigmoid_k: 0.08                     # steepness of the sensitivity curve
  sigmoid_midpoint: 50.0              # shedding rate at which sensitivity = S_max/2
  specificity: 0.97
  cadence: 1                          # applied per sick-call agent (on-demand)

# ── Targeted PCR ─────────────────────────────────────────────
targeted_pcr:
  description: "RT-qPCR panel for environmental / surface wipe samples"
  extraction_efficiency: 0.35         # η – fraction of pathogen mass recovered
  ct_slope: -3.322                    # k  in  Ct = -k * log10(M) + b  (≈ 100% efficiency)
  ct_intercept: 40.0                  # b  (Ct at 1 unit of recovered mass)
  lod_ct_threshold: 38.0              # Ct > this ⇒ Negative
  cadence: 4                          # baseline; escalation overrides to 1

# ── Multi-Pathogen Configuration ──────────────────────────────
multi_pathogen:
  profiles_path: "data/pathogens/active_profiles.json"
  enable_coinfection: true            # allow agents to carry multiple pathogens
  # Default susceptibility multiplier for immunocompromised agents
  immunocompromised_fraction: 0.05    # fraction of agents with elevated susceptibility
  immunocompromised_multiplier: 2.0   # dose scaling for immunocompromised

# ── Microflora Disruption ────────────────────────────────────
microflora:
  enable_dual_signal: true            # shed altered microflora alongside pathogen
  # Per-zone microbial mass pool shed by disrupted hosts per epoch
  disrupted_shed_mass: 50.0           # baseline microbial mass units per shedding agent
  # GRUMB CLR shift magnitude scaling
  clr_shift_scale: 0.15              # scales the kingdom-level CLR perturbation
  # Graywater downstream zones (accumulate microbial signatures)
  graywater_zones: ["Engine_Room"]

# ── Metagenomic Sequencing (orchestrator modality) ───────────
# Shotgun metagenomics via MetagenomicSequencing.query_ground_truth().
sequencing:
  description: "Metagenomic shotgun sequencing of environmental samples"
  read_depth: 100000                  # total reads per zone per sequencing epoch
  pseudocount: 1.0e-6                 # for CLR zero-handling
  clr_shift_scale: 0.15               # microflora disruption CLR perturbation scale
  cadence: 8                          # baseline; escalation may override

# ── Wastewater Sequencing Grid (observation instrument) ──────
# Pooled greywater metagenomics via WastewaterSequencingGrid (every epoch).
wastewater_sequencing:
  description: "Dirichlet-multinomial metagenomic sampling from wastewater pools"
  read_depth: 50000                   # total reads per zone sample
  dirichlet_concentration: 100.0      # Dirichlet prior strength (compositional noise)
  pseudocount: 1.0e-6                 # for CLR zero-handling

# ── Wearable Physiological Monitoring ────────────────────────
# Extensible device registry.  Each device defines its sensor
# channels, noise model, and infection-response profiles.
# The class_device_map deploys devices to agent classes.
wearable_monitoring:
  enabled: true

  # ── Sample Device 1: Oura Ring ───────────────────────────────
  # Focus on sleep, HRV, body temperature, SpO2.
  # Lightweight form factor → no continuous HR during activity.
  devices:
    - device_id: "oura_ring"
      channels:
        - heart_rate
        - hrv
        - body_temp
        - spo2
        - sleep_score
        - respiratory_rate
      noise:
        - {channel: heart_rate,      sigma: 2.5,  drift_rate: 0.1,  dropout_prob: 0.01}
        - {channel: hrv,             sigma: 6.0,  drift_rate: 0.5,  dropout_prob: 0.01}
        - {channel: body_temp,       sigma: 0.10, drift_rate: 0.01, dropout_prob: 0.005}
        - {channel: spo2,            sigma: 0.4,  drift_rate: 0.02, dropout_prob: 0.008}
        - {channel: sleep_score,     sigma: 3.0,  drift_rate: 0.0,  dropout_prob: 0.0}
        - {channel: respiratory_rate, sigma: 1.0, drift_rate: 0.05, dropout_prob: 0.005}
      infection_responses:
        - pathogen_category: "enteric_viral"
          channel_responses:
            - {channel: heart_rate,       early: 3.0,  peak: 10.0, late: 5.0,  recovery: 1.0}
            - {channel: body_temp,        early: 0.3,  peak: 1.5,  late: 0.8,  recovery: 0.1}
            - {channel: spo2,             early: 0.0,  peak: -0.5, late: -0.3, recovery: 0.0}
            - {channel: respiratory_rate,  early: 0.5, peak: 2.0,  late: 1.0,  recovery: 0.2}
            - {channel: hrv,              early: -3.0, peak: -15.0, late: -8.0, recovery: -2.0}
            - {channel: sleep_score,      early: -5.0, peak: -25.0, late: -15.0, recovery: -3.0}
        - pathogen_category: "respiratory_viral"
          channel_responses:
            - {channel: heart_rate,       early: 2.0,  peak: 12.0, late: 6.0,  recovery: 1.5}
            - {channel: body_temp,        early: 0.4,  peak: 1.8,  late: 1.0,  recovery: 0.2}
            - {channel: spo2,             early: -0.5, peak: -3.0, late: -1.5, recovery: -0.3}
            - {channel: respiratory_rate,  early: 1.0, peak: 5.0,  late: 2.5,  recovery: 0.5}
            - {channel: hrv,              early: -4.0, peak: -18.0, late: -10.0, recovery: -3.0}
            - {channel: sleep_score,      early: -5.0, peak: -30.0, late: -18.0, recovery: -5.0}
      phase_boundaries:
        - {day: 0,  phase: "early"}
        - {day: 3,  phase: "peak"}
        - {day: 8,  phase: "late"}
        - {day: 12, phase: "recovery"}

    # ── Sample Device 2: Garmin Watch ────────────────────────────
    # Full-spectrum fitness watch: continuous HR, activity, SpO2.
    # Less precise on temperature (wrist-based) but adds activity tracking.
    - device_id: "garmin_watch"
      channels:
        - heart_rate
        - hrv
        - body_temp
        - spo2
        - activity_score
        - respiratory_rate
      noise:
        - {channel: heart_rate,      sigma: 1.8,  drift_rate: 0.08, dropout_prob: 0.003}
        - {channel: hrv,             sigma: 5.0,  drift_rate: 0.4,  dropout_prob: 0.008}
        - {channel: body_temp,       sigma: 0.15, drift_rate: 0.02, dropout_prob: 0.01}
        - {channel: spo2,            sigma: 0.5,  drift_rate: 0.03, dropout_prob: 0.005}
        - {channel: activity_score,  sigma: 4.0,  drift_rate: 0.0,  dropout_prob: 0.0}
        - {channel: respiratory_rate, sigma: 0.9, drift_rate: 0.04, dropout_prob: 0.004}
      infection_responses:
        - pathogen_category: "enteric_viral"
          channel_responses:
            - {channel: heart_rate,       early: 3.0,  peak: 10.0, late: 5.0,  recovery: 1.0}
            - {channel: body_temp,        early: 0.2,  peak: 1.2,  late: 0.6,  recovery: 0.1}
            - {channel: spo2,             early: 0.0,  peak: -0.5, late: -0.3, recovery: 0.0}
            - {channel: respiratory_rate,  early: 0.5, peak: 2.0,  late: 1.0,  recovery: 0.2}
            - {channel: hrv,              early: -3.0, peak: -14.0, late: -7.0, recovery: -2.0}
            - {channel: activity_score,   early: -5.0, peak: -20.0, late: -10.0, recovery: -2.0}
        - pathogen_category: "respiratory_viral"
          channel_responses:
            - {channel: heart_rate,       early: 2.0,  peak: 12.0, late: 6.0,  recovery: 1.5}
            - {channel: body_temp,        early: 0.3,  peak: 1.4,  late: 0.8,  recovery: 0.15}
            - {channel: spo2,             early: -0.5, peak: -3.0, late: -1.5, recovery: -0.3}
            - {channel: respiratory_rate,  early: 1.0, peak: 5.0,  late: 2.5,  recovery: 0.5}
            - {channel: hrv,              early: -4.0, peak: -18.0, late: -10.0, recovery: -3.0}
            - {channel: activity_score,   early: -5.0, peak: -25.0, late: -12.0, recovery: -3.0}
      phase_boundaries:
        - {day: 0,  phase: "early"}
        - {day: 3,  phase: "peak"}
        - {day: 8,  phase: "late"}
        - {day: 12, phase: "recovery"}

  # ── Device Deployment Map ──────────────────────────────────────
  # Maps agent classes → device type.  "default" is the fallback.
  class_device_map:
    - {agent_class: "default",            device_id: "oura_ring"}
    - {agent_class: "crew_medical",       device_id: "garmin_watch"}
    - {agent_class: "crew_engineering",   device_id: "garmin_watch"}
    - {agent_class: "crew_galley",        device_id: "garmin_watch"}
    - {agent_class: "passenger_elderly",  device_id: "oura_ring"}

  # ── Observation layer noise (Crusher Labs) ─────────────────────
  observation_noise_sigma: 0.5
  sync_dropout_prob: 0.02
  anomaly_z_threshold: 2.0
